# Builds ghcr.io/mawcs/homarr: the latest upstream Homarr release plus the drag-a-URL feature.
# Runs daily and only builds when there is something new (a new upstream release or a new
# commit on the feature branch). See docs/staying-current.md.
name: "[Fork] Build image"

on:
  schedule:
    - cron: "23 6 * * *" # daily, 06:23 UTC
  workflow_dispatch:
    inputs:
      upstream-tag:
        description: Upstream release tag to build, for example v2.6.0 (default is the latest release)
        required: false
      force:
        description: Rebuild even if this exact image already exists
        type: boolean
        default: false

permissions:
  contents: read
  packages: write # push the image to GHCR
  actions: write # disable upstream workflows in the fork

env:
  IMAGE: ghcr.io/mawcs/homarr
  FEATURE_BRANCH: feat/drop-url-to-add-app

concurrency:
  group: fork-build-image

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          path: fork-tools

      - name: Disable upstream workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fork-tools/scripts/disable-upstream-workflows.sh

      - name: Assemble source (upstream release + feature)
        id: source
        env:
          UPSTREAM_TAG: ${{ inputs.upstream-tag }}
        run: |
          bash fork-tools/scripts/prepare-build-source.sh "$RUNNER_TEMP/src" "$UPSTREAM_TAG" > "$RUNNER_TEMP/source.env"
          source "$RUNNER_TEMP/source.env"
          cat "$RUNNER_TEMP/source.env" >> "$GITHUB_OUTPUT"
          echo "short_sha=${feature_sha:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Skip if this image already exists
        id: existing
        run: |
          exact="$IMAGE:${{ steps.source.outputs.tag }}-dnd-${{ steps.source.outputs.short_sha }}"
          if [ "${{ inputs.force }}" != "true" ] && docker buildx imagetools inspect "$exact" > /dev/null 2>&1; then
            echo "$exact already exists, nothing to do." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose tags
        if: steps.existing.outputs.skip != 'true'
        id: tags
        run: |
          base="$IMAGE:${{ steps.source.outputs.tag }}-dnd"
          tags="$base,$base-${{ steps.source.outputs.short_sha }}"
          if [ "${{ steps.source.outputs.tag }}" = "${{ steps.source.outputs.latest_release }}" ]; then
            tags="$tags,$IMAGE:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4
        if: steps.existing.outputs.skip != 'true'

      - uses: docker/build-push-action@v7
        if: steps.existing.outputs.skip != 'true'
        with:
          context: ${{ runner.temp }}/src
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Homarr ${{ steps.source.outputs.tag }} with drag-a-URL-to-add-an-app
            org.opencontainers.image.version=${{ steps.source.outputs.tag }}-dnd
            org.opencontainers.image.revision=${{ steps.source.outputs.feature_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: steps.existing.outputs.skip != 'true'
        run: |
          {
            echo "### Published"
            echo
            tr ',' '\n' <<< "${{ steps.tags.outputs.tags }}" | sed 's/^/- `/; s/$/`/'
            echo
            echo "Upstream ${{ steps.source.outputs.tag }} + feature branch at ${{ steps.source.outputs.feature_sha }}."
          } >> "$GITHUB_STEP_SUMMARY"
